name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile runner/aggregate.py

      - name: Verify required-path ERROR blocks the gate
        id: expected-policy-failure
        uses: ./
        continue-on-error: true
        with:
          mod-path: examples/policy-failure
          config-file: examples/policy-failure/modrelease.toml
          gate: error
          artifact-name: policy-failure-report
      - name: Assert required-path failure was blocking
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.expected-policy-failure.outcome }}
        run: test "$ACTION_OUTCOME" = "failure"
