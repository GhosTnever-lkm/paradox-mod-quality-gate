name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile runner/aggregate.py

      - name: Verify required-path ERROR blocks the gate
        id: expected-policy-failure
        uses: ./
        continue-on-error: true
        with:
          mod-path: examples/policy-failure
          config-file: examples/policy-failure/modrelease.toml
          gate: error
          artifact-name: policy-failure-report
      - name: Assert required-path failure was blocking
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.expected-policy-failure.outcome }}
        run: test "$ACTION_OUTCOME" = "failure"
      - name: Assert SARIF survives a blocking finding
        if: always()
        env:
          SARIF_READY: ${{ steps.expected-policy-failure.outputs['sarif-ready'] }}
          SARIF_REPORT: ${{ steps.expected-policy-failure.outputs['sarif-report'] }}
        run: |
          test "$SARIF_READY" = "true"
          test -f "$SARIF_REPORT"
          python - "$SARIF_REPORT" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["version"] == "2.1.0"
          assert any(item["level"] == "error" for item in report["runs"][0]["results"])
          PY
      - name: Assert exact installed ModRelease Studio version
        run: python -c 'from importlib.metadata import version; actual = version("modrelease-studio"); print(f"modrelease-studio {actual}"); assert actual == "0.3.59", actual'
      - name: Assert exact installed Paradox Mod Workbench version
        run: python -c 'from importlib.metadata import version; actual = version("paradox-mod-workbench"); print(f"paradox-mod-workbench {actual}"); assert actual == "0.2.3", actual'
      - name: Verify installed scanner traversal policy
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          from modrelease_studio.scanner import scan_path
          with TemporaryDirectory() as directory:
              root = Path(directory)
              generated = root / ".venv" / "sample.cfg"
              generated.parent.mkdir(parents=True)
              generated.write_text("api_key=FAKE_api_key_value_123456789", encoding="utf-8")
              (root / ".DS_Store").write_bytes(b"")
              (root / "mod.cfg").write_text("name=sample", encoding="utf-8")
              with patch("modrelease_studio.sources.MAX_ENTRIES", 2):
                  report = scan_path(root, config={"required_files": []})
          codes = {item.code for item in report.findings}
          assert "GENERIC_API_KEY" not in codes
          assert "OS_JUNK" in codes
          assert "ENTRY_LIMIT" not in codes
          assert report.file_count == 2 and report.errors == 0
          PYCODE
      - name: Verify ZIP scans include generated-directory secrets
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from zipfile import ZipFile
          from modrelease_studio.scanner import scan_path
          with TemporaryDirectory() as directory:
              archive = Path(directory) / "release.zip"
              with ZipFile(archive, "w") as bundle:
                  bundle.writestr(".git/config.cfg", "api_key=FAKE_api_key_value_123456789")
              report = scan_path(archive, config={"required_files": []})
          assert any(item.code == "GENERIC_API_KEY" and item.path == ".git/config.cfg" for item in report.findings)
          assert report.errors == 1
          PYCODE
      - name: Verify installed scanner reports file-size growth
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          from modrelease_studio.models import FileRecord, Source
          from modrelease_studio.scanner import scan_source
          with TemporaryDirectory() as directory:
              source = Source(Path(directory), [FileRecord("growing.txt", 1)], [], False)
              with patch.object(Source, "read", return_value=b"x" * 11), patch.object(Source, "digest", return_value="0" * 64):
                  report = scan_source(source, config={"max_file_bytes": 10, "required_files": []})
          finding = next(item for item in report.findings if item.code == "LARGE_TEXT_FILE")
          assert finding.severity == "WARNING" and "exceeded" in finding.message
          assert report.status == "REVIEW"
          PYCODE
      - name: Verify scanner warning gate modes end-to-end
        run: |
          temp_dir="$RUNNER_TEMP/growth-gate"
          mkdir -p "$temp_dir"
          MODRELEASE_REPORT="$temp_dir/modrelease.json" python - <<'PYCODE'
          import json, os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          from modrelease_studio.models import FileRecord, Source
          from modrelease_studio.reports import json_report
          from modrelease_studio.scanner import scan_source
          with TemporaryDirectory() as directory:
              source = Source(Path(directory), [FileRecord("growing.txt", 1)], [], False)
              with patch.object(Source, "read", return_value=b"x" * 11), patch.object(Source, "digest", return_value="0" * 64):
                  report = scan_source(source, config={"max_file_bytes": 10, "required_files": []})
          Path(os.environ["MODRELEASE_REPORT"]).write_text(json_report(report), encoding="utf-8")
          Path(os.path.join(os.path.dirname(os.environ["MODRELEASE_REPORT"]), "workbench.json")).write_text(json.dumps({"findings": []}), encoding="utf-8")
          PYCODE
          workbench="$temp_dir/workbench.json"
          python runner/aggregate.py --modrelease "$temp_dir/modrelease.json" --workbench "$workbench" --json-out "$temp_dir/error.json" --md-out "$temp_dir/error.md" --gate error
          set +e
          python runner/aggregate.py --modrelease "$temp_dir/modrelease.json" --workbench "$workbench" --json-out "$temp_dir/warning.json" --md-out "$temp_dir/warning.md" --gate warning
          result=$?
          set -e
          test "$result" -eq 1
          python - "$temp_dir/error.json" "$temp_dir/warning.json" <<'PYCODE'
          import json,sys
          for path in sys.argv[1:]:
              report=json.load(open(path,encoding="utf-8"))
              assert report["counts"]["warning"] == 1
              assert any(item["code"] == "LARGE_TEXT_FILE" for item in report["findings"])
          PYCODE
      - name: Verify JUNCTION warning respects gate thresholds
        run: |
          temp_dir="$RUNNER_TEMP/junction-gate"
          mkdir -p "$temp_dir"
          MODRELEASE_REPORT="$temp_dir/modrelease.json" python - <<'PYCODE'
          import json, os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          from modrelease_studio.reports import json_report
          from modrelease_studio.scanner import scan_path
          with TemporaryDirectory() as directory:
              root = Path(directory) / "mod"
              junction = root / "junction"
              junction.mkdir(parents=True)
              (junction / "fixture.txt").write_text("synthetic fixture", encoding="utf-8")
              with patch.object(Path, "is_junction", lambda path: path.name == "junction", create=True):
                  report = scan_path(root, config={"required_files": []})
          finding = next(item for item in report.findings if item.code == "JUNCTION")
          assert finding.severity == "WARNING" and report.status == "REVIEW"
          Path(os.environ["MODRELEASE_REPORT"]).write_text(json_report(report), encoding="utf-8")
          Path(os.path.join(os.path.dirname(os.environ["MODRELEASE_REPORT"]), "workbench.json")).write_text(
              json.dumps({"findings": []}), encoding="utf-8")
          PYCODE
          workbench="$temp_dir/workbench.json"
          python runner/aggregate.py --modrelease "$temp_dir/modrelease.json" --workbench "$workbench" --json-out "$temp_dir/error.json" --md-out "$temp_dir/error.md" --gate error
          set +e
          python runner/aggregate.py --modrelease "$temp_dir/modrelease.json" --workbench "$workbench" --json-out "$temp_dir/warning.json" --md-out "$temp_dir/warning.md" --gate warning
          warning_status=$?
          set -e
          test "$warning_status" -eq 1
          python - "$temp_dir/error.json" "$temp_dir/warning.json" <<'PYCODE'
          import json,sys
          for path in sys.argv[1:]:
              report=json.load(open(path,encoding="utf-8"))
              assert report["counts"]["warning"] == 1
              assert any(item["code"] == "JUNCTION" for item in report["findings"])
          PYCODE
      - name: Verify unreadable junction metadata is pruned and gated
        run: |
          temp_dir="$RUNNER_TEMP/metadata-gate"
          mkdir -p "$temp_dir"
          MODRELEASE_REPORT="$temp_dir/modrelease.json" python - <<'PYCODE'
          import json, os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          from modrelease_studio.reports import json_report
          from modrelease_studio.scanner import scan_path
          with TemporaryDirectory() as directory:
              root = Path(directory) / "mod"
              restricted = root / "restricted"
              restricted.mkdir(parents=True)
              (root / "inside.txt").write_text("inside fixture", encoding="utf-8")
              (restricted / "private-fixture.txt").write_text("do not index", encoding="utf-8")
              def junction_status(path):
                  if path.name == "restricted":
                      raise PermissionError(13, "Permission denied", str(path))
                  return False
              with patch.object(Path, "is_junction", junction_status, create=True):
                  report = scan_path(root, config={"required_files": []})
          finding = next(item for item in report.findings if item.code == "READ_METADATA")
          assert finding.path == "restricted" and finding.severity == "WARNING"
          assert report.file_count == 1 and report.errors == 0
          Path(os.environ["MODRELEASE_REPORT"]).write_text(json_report(report), encoding="utf-8")
          Path(os.path.join(os.path.dirname(os.environ["MODRELEASE_REPORT"]), "workbench.json")).write_text(
              json.dumps({"findings": []}), encoding="utf-8")
          PYCODE
          workbench="$temp_dir/workbench.json"
          python runner/aggregate.py --modrelease "$temp_dir/modrelease.json" --workbench "$workbench" --json-out "$temp_dir/error.json" --md-out "$temp_dir/error.md" --gate error
          set +e
          python runner/aggregate.py --modrelease "$temp_dir/modrelease.json" --workbench "$workbench" --json-out "$temp_dir/warning.json" --md-out "$temp_dir/warning.md" --gate warning
          warning_status=$?
          set -e
          test "$warning_status" -eq 1
          python - "$temp_dir/error.json" "$temp_dir/warning.json" <<'PYCODE'
          import json,sys
          for path in sys.argv[1:]:
              report=json.load(open(path,encoding="utf-8"))
              assert report["counts"]["warning"] == 1
              assert any(item["code"] == "READ_METADATA" and item["path"] == "restricted" for item in report["findings"])
          PYCODE
      - name: Create invisible-path report fixture
        run: |
          mkdir -p unicode-project
          cat > unicode-project/modrelease.toml <<'TOML'
          [scan]
          required_paths = ["missing\u202eext\u2028line\u2029end.txt"]
          required_paths_severity = "INFO"
          TOML
      - name: Verify combined reports sanitize scanner output
        id: unicode-report
        uses: ./
        with:
          mod-path: unicode-project
          config-file: unicode-project/modrelease.toml
          gate: error
          artifact-name: unicode-report
      - name: Assert unified report escapes invisibles
        env:
          JSON_REPORT: ${{ steps.unicode-report.outputs['json-report'] }}
          MARKDOWN_REPORT: ${{ steps.unicode-report.outputs['markdown-report'] }}
          SARIF_REPORT: ${{ steps.unicode-report.outputs['sarif-report'] }}
          SARIF_READY: ${{ steps.unicode-report.outputs['sarif-ready'] }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          json_text = Path(os.environ["JSON_REPORT"]).read_text(encoding="utf-8")
          markdown = Path(os.environ["MARKDOWN_REPORT"]).read_text(encoding="utf-8")
          sarif_text = Path(os.environ["SARIF_REPORT"]).read_text(encoding="utf-8")
          for char in (chr(0x202E), chr(0x2028), chr(0x2029)):
              assert char not in json_text and char not in markdown
          report = json.loads(json_text)
          finding = next(item for item in report["findings"] if item["code"] == "REQUIRED_PATH_MISSING")
          path = finding["path"].lower()
          assert r"\u{202e}" in path and r"\u{2028}" in path and r"\u{2029}" in path
          assert "2028" in markdown.lower() and "2029" in markdown.lower()
          sarif = json.loads(sarif_text)
          assert sarif["version"] == "2.1.0"
          assert os.environ["SARIF_READY"] == "true"
          sarif_text_lower = sarif_text.lower()
          assert r"\u202e" in sarif_text_lower
          assert "uriBaseId" not in sarif_text and "originalUriBaseIds" not in sarif_text
          PY
