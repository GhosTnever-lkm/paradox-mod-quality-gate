name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile runner/aggregate.py

      - name: Verify required-path ERROR blocks the gate
        id: expected-policy-failure
        uses: ./
        continue-on-error: true
        with:
          mod-path: examples/policy-failure
          config-file: examples/policy-failure/modrelease.toml
          gate: error
          artifact-name: policy-failure-report
      - name: Assert required-path failure was blocking
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.expected-policy-failure.outcome }}
        run: test "$ACTION_OUTCOME" = "failure"
      - name: Assert exact installed ModRelease Studio version
        run: python -c 'from importlib.metadata import version; actual = version("modrelease-studio"); print(f"modrelease-studio {actual}"); assert actual == "0.3.44", actual'
      - name: Create invisible-path report fixture
        run: |
          mkdir -p unicode-project
          cat > unicode-project/modrelease.toml <<'TOML'
          [scan]
          required_paths = ["missing\u202eext\u2028line\u2029end.txt"]
          required_paths_severity = "INFO"
          TOML
      - name: Verify combined reports sanitize scanner output
        id: unicode-report
        uses: ./
        with:
          mod-path: unicode-project
          config-file: unicode-project/modrelease.toml
          gate: error
          artifact-name: unicode-report
      - name: Assert unified report escapes invisibles
        env:
          JSON_REPORT: ${{ steps.unicode-report.outputs['json-report'] }}
          MARKDOWN_REPORT: ${{ steps.unicode-report.outputs['markdown-report'] }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          json_text = Path(os.environ["JSON_REPORT"]).read_text(encoding="utf-8")
          markdown = Path(os.environ["MARKDOWN_REPORT"]).read_text(encoding="utf-8")
          for char in (chr(0x202E), chr(0x2028), chr(0x2029)):
              assert char not in json_text and char not in markdown
          report = json.loads(json_text)
          finding = next(item for item in report["findings"] if item["code"] == "REQUIRED_PATH_MISSING")
          path = finding["path"].lower()
          assert r"\u{202e}" in path and r"\u{2028}" in path and r"\u{2029}" in path
          assert "2028" in markdown.lower() and "2029" in markdown.lower()
          PY
